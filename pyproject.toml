[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-grammar"
version = "0.1.0"
description = "Generic, ABM-agnostic implementation of the cell-behavior hypothesis grammar (Johnson et al., Cell 2025) as a process-bigraph module"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=1.8.1",
    "process-bigraph>=1.8.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "plotly>=5.20",
    "pandas>=2.0",
]
dashboard = [
    "bigraph-viz>=2.0.3",
    "vivarium-workbench",
    "pyyaml",
    "jsonschema",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-grammar"
Issues = "https://github.com/vivarium-collective/viva-grammar/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_grammar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end phenotype run"]
